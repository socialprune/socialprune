name: CLI browser suites
run-name: CLI browser suites (${{ inputs.suites || 'all' }})

on:
  push:
    branches: ['suites/**']
  workflow_dispatch:
    inputs:
      suites:
        description: all or a comma-separated subset of delete,engine,context,fill,delete-instagram
        type: string
        required: true
        default: all
      placement-only:
        description: Run only the generated Windows foreground and bounds probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: browser-suites-${{ github.ref }}-${{ inputs.placement-only && 'placement' || 'suites' }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      context: ${{ steps.selected.outputs.context }}
      other: ${{ steps.selected.outputs.other }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select suites
        id: selected
        env:
          SUITES: ${{ inputs.suites || 'all' }}
        run: node .github/scripts/browser-suite.mjs select "$SUITES" >> "$GITHUB_OUTPUT"

  suites:
    needs: select
    if: needs.select.outputs.other == 'true'
    runs-on: windows-latest
    # Other suites retain their serial bounds; context has separate runners.
    timeout-minutes: 180
    env:
      CI: 'true'
      # Generated fakes only. Setup downloads finish before any suite starts.
      SP_X_TEST_PORT: '4651'
      SP_CONFIRMATION_TEST_PORT: '4652'
      SP_REVIEW_MEDIA_TEST_PORT: '4653'
      SP_STYLE_TEST_PORT: '4654'
      SP_FOREIGN_TEST_PORT: '4655'
      SP_ENGINE_INSTAGRAM_TEST_PORT: '4656'
      SP_CONTEXT_TEST_PORT: '4657'
      SP_CONTEXT_CONFIRMATION_TEST_PORT: '4658'
      SP_CONTEXT_SERVER_TEST_PORT: '4659'
      SP_CONTEXT_REVIEW_TEST_PORT: '4660'
      SP_CONTEXT_FOREIGN_TEST_PORT: '4661'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Select suites
        id: selected
        env:
          SUITES: ${{ inputs.suites || 'all' }}
        run: |
          $selected = node .github/scripts/browser-suite.mjs select $env:SUITES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selected >> $env:GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Install pinned test Chromium
        run: pnpm --filter socialprune exec playwright install chromium
        timeout-minutes: 5
      # The existing fill config includes local-review media checks.
      - name: Build local review assets
        if: steps.selected.outputs.fill == 'true'
        run: pnpm --filter @socialprune/web build:review
        timeout-minutes: 5
      - name: Setup complete
        id: ready
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          node --version
      # Other suites stay serial. Context runs on separate shard runners.
      - name: X deletion suite
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.selected.outputs.delete == 'true' }}
        timeout-minutes: 27
        run: node .github/scripts/browser-suite.mjs run delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.selected.outputs.delete == 'true' }}
        with:
          name: browser-suite-delete-${{ github.run_attempt }}
          path: apps/cli/test-results/browser-suites/delete/
          if-no-files-found: warn
          retention-days: 7
      - name: Desktop engine controls suite
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.selected.outputs.engine == 'true' }}
        timeout-minutes: 12
        run: node .github/scripts/browser-suite.mjs run engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.selected.outputs.engine == 'true' }}
        with:
          name: browser-suite-engine-${{ github.run_attempt }}
          path: apps/cli/test-results/browser-suites/engine/
          if-no-files-found: warn
          retention-days: 7
      - name: X originals fill suite
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.selected.outputs.fill == 'true' }}
        timeout-minutes: 27
        run: node .github/scripts/browser-suite.mjs run fill
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.selected.outputs.fill == 'true' }}
        with:
          name: browser-suite-fill-${{ github.run_attempt }}
          path: apps/cli/test-results/browser-suites/fill/
          if-no-files-found: warn
          retention-days: 7

      - name: Instagram deletion suite
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.selected.outputs['delete-instagram'] == 'true' }}
        # 142 s locally on 2026-10-25; 3x rounded to 8 min in the runner,
        # plus 2 min to terminate children and retain its independent artifacts.
        timeout-minutes: 10
        run: node .github/scripts/browser-suite.mjs run delete-instagram
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.selected.outputs['delete-instagram'] == 'true' }}
        with:
          name: browser-suite-delete-instagram-${{ github.run_attempt }}
          path: apps/cli/test-results/browser-suites/delete-instagram/
          if-no-files-found: warn
          retention-days: 7

  context:
    needs: select
    if: needs.select.outputs.context == 'true' && inputs.placement-only != true
    runs-on: windows-latest
    # 40 before the added Edge placement step in shard 1 (up to 4 minutes).
    timeout-minutes: 44
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      # Each shard owns a separate runner/process; fake-server ports can repeat
      # across shards without sharing listeners or platform state.
      SP_X_TEST_PORT: '4771'
      SP_CONFIRMATION_TEST_PORT: '4772'
      SP_REVIEW_MEDIA_TEST_PORT: '4773'
      SP_STYLE_TEST_PORT: '4774'
      SP_FOREIGN_TEST_PORT: '4775'
      SP_CONTEXT_TEST_PORT: '4776'
      SP_CONTEXT_CONFIRMATION_TEST_PORT: '4777'
      SP_CONTEXT_SERVER_TEST_PORT: '4778'
      SP_CONTEXT_REVIEW_TEST_PORT: '4779'
      SP_CONTEXT_FOREIGN_TEST_PORT: '4780'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter socialprune exec playwright install chromium
        timeout-minutes: 5
      - name: Instagram context case shard
        # 30 min runner bound plus 2 min to terminate children/write receipts.
        timeout-minutes: 32
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node .github/scripts/browser-suite.mjs run context apps/cli/test-results/browser-suites ${{ matrix.shard }}
      - name: Measure Instagram placement and foreground ownership on Windows
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 4
        run: pnpm exec vitest run --config apps/cli/e2e/placement.vitest.config.ts -t "^PLACEMENT Windows foreground sentinel"
      - name: Measure Instagram placement on the runner's installed Microsoft Edge
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 4
        env:
          SP_PLACEMENT_BROWSER: msedge
        run: pnpm exec vitest run --config apps/cli/e2e/placement.vitest.config.ts -t "^PLACEMENT Windows foreground sentinel"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && matrix.shard == 1 }}
        with:
          name: instagram-placement-${{ github.run_attempt }}
          path: apps/cli/test-results/placement/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-suite-context-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/cli/test-results/browser-suites/context-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  placement:
    if: inputs.placement-only == true
    runs-on: windows-latest
    # 10 before the added Edge probe step (up to 4 minutes).
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter socialprune exec playwright install chromium
        timeout-minutes: 5
      - name: Measure foreground and placement before full-suite admission
        timeout-minutes: 4
        run: pnpm exec vitest run --config apps/cli/e2e/placement.vitest.config.ts -t "^PLACEMENT Windows foreground sentinel"
      - name: Measure placement on the runner's installed Microsoft Edge
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          SP_PLACEMENT_BROWSER: msedge
        run: pnpm exec vitest run --config apps/cli/e2e/placement.vitest.config.ts -t "^PLACEMENT Windows foreground sentinel"
      - name: Verify focused reader recycle and sibling-zero canary
        timeout-minutes: 4
        run: pnpm exec vitest run --config apps/cli/e2e/context.vitest.config.ts -t "^C35 IG19 recycles once between20|^STALL2 ordered unchecked sibling zero" --maxWorkers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instagram-placement-${{ github.run_attempt }}
          path: apps/cli/test-results/placement/
          if-no-files-found: error
          retention-days: 7

  context-aggregate:
    needs: [select, context]
    if: ${{ always() && needs.select.outputs.context == 'true' && inputs.placement-only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: browser-suite-context-*
          path: context-artifacts
      - name: Verify every context shard and exact total coverage
        env:
          SHARDS_RESULT: ${{ needs.context.result }}
        run: |
          node .github/scripts/browser-suite.mjs aggregate-context context-artifacts context-aggregate.json
          test "$SHARDS_RESULT" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-aggregate-${{ github.run_attempt }}
          path: context-aggregate.json
          if-no-files-found: error
          retention-days: 7
