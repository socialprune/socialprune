name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm licenses:check
      - run: pnpm copy:check
      - run: pnpm i18n:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm fixtures:check
      - run: pnpm schemas:check
      - run: pnpm guide:check
      - run: pnpm build

  # ADR-015: the CLI's workspace floor is Node 24.15.0, where node:sqlite is a
  # release candidate. This job runs the CLI tests on exactly that version, so a
  # dependency on a newer 24.x API fails here instead of on a user's machine.
  cli-node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project cli

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Keep each browser's complete main config together on its own runner.
    # 30 min dependency bound + 5 min download + 25 min build/test allowance.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SP_E2E_PORT: 4771
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 2026-10-22: apt took 14m09s once and exceeded 20 min twice; browser
      # downloads took 12-16 s. Bound dependency setup separately from tests.
      - name: Install browser system dependencies
        timeout-minutes: 30
        shell: bash
        # Playwright does not support caching OS packages. Retry installation,
        # not tests; 16m encloses the measured 14m09s success, with 10m recovery.
        # Retain apt's mirror, TLS and signature checks.
        run: |
          attempt=0
          for duration in 16m 10m; do
            attempt=$((attempt + 1))
            echo "Playwright system dependency attempt $attempt of 2 (limit $duration)"
            if timeout --signal=TERM --kill-after=30s "$duration" pnpm --filter @socialprune/web exec playwright install-deps chromium firefox webkit; then
              exit 0
            else
              status=$?
            fi
            echo "Dependency installation failed with exit $status"
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            # A terminated apt install may leave configuration pending.
            timeout --signal=TERM --kill-after=10s 60s sudo dpkg --configure -a
            sleep 10
          done
      - name: Install pinned browsers
        timeout-minutes: 5
        run: pnpm --filter @socialprune/web exec playwright install chromium firefox webkit
      - name: Main config
        timeout-minutes: 25
        run: pnpm --filter @socialprune/web test:e2e:main --project ${{ matrix.browser }}

  e2e-layout:
    runs-on: ubuntu-latest
    # Independent layout/policy configs no longer wait behind the main config.
    timeout-minutes: 60
    env:
      SP_E2E_PORT: 4771
      SP_E2E_INSTAGRAM_PORT: 4772
      SP_E2E_PROBE_PORT: 4773
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser system dependencies
        timeout-minutes: 30
        shell: bash
        run: |
          attempt=0
          for duration in 16m 10m; do
            attempt=$((attempt + 1))
            echo "Playwright system dependency attempt $attempt of 2 (limit $duration)"
            if timeout --signal=TERM --kill-after=30s "$duration" pnpm --filter @socialprune/web exec playwright install-deps chromium firefox webkit; then
              exit 0
            else
              status=$?
            fi
            echo "Dependency installation failed with exit $status"
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            timeout --signal=TERM --kill-after=10s 60s sudo dpkg --configure -a
            sleep 10
          done
      - name: Install pinned browsers
        timeout-minutes: 5
        run: pnpm --filter @socialprune/web exec playwright install chromium firefox webkit
      - name: Polish, fit, Instagram and policy probes
        timeout-minutes: 25
        run: pnpm --filter @socialprune/web test:e2e:layout

  e2e-builds:
    runs-on: ubuntu-latest
    # Build checks and isolated renderers do not need a prior job's artifacts.
    timeout-minutes: 50
    env:
      SP_E2E_DESKTOP_PORT: 4774
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser system dependencies
        timeout-minutes: 30
        shell: bash
        run: |
          attempt=0
          for duration in 16m 10m; do
            attempt=$((attempt + 1))
            echo "Playwright system dependency attempt $attempt of 2 (limit $duration)"
            if timeout --signal=TERM --kill-after=30s "$duration" pnpm --filter @socialprune/web exec playwright install-deps chromium firefox webkit; then
              exit 0
            else
              status=$?
            fi
            echo "Dependency installation failed with exit $status"
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            timeout --signal=TERM --kill-after=10s 60s sudo dpkg --configure -a
            sleep 10
          done
      - name: Install pinned browsers
        timeout-minutes: 5
        run: pnpm --filter @socialprune/web exec playwright install chromium firefox webkit
      - name: Production build check, review mode and desktop renderer
        timeout-minutes: 15
        run: pnpm --filter @socialprune/web test:e2e:builds

  # ADR-016: the local-review build in a real browser against the real review
  # server, in its own job so the web e2e job keeps its time budget.
  review-e2e:
    runs-on: ubuntu-latest
    # 30 min dependency bound + 5 min browser download + 5 min review allowance.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same measured apt/download split as e2e above; no browser-only cache
      # can remove the observed apt bottleneck on a fresh runner.
      - name: Install browser system dependencies
        timeout-minutes: 30
        shell: bash
        run: |
          attempt=0
          for duration in 16m 10m; do
            attempt=$((attempt + 1))
            echo "Playwright system dependency attempt $attempt of 2 (limit $duration)"
            if timeout --signal=TERM --kill-after=30s "$duration" pnpm --filter socialprune exec playwright install-deps chromium firefox webkit; then
              exit 0
            else
              status=$?
            fi
            echo "Dependency installation failed with exit $status"
            if [ "$attempt" -eq 2 ]; then exit "$status"; fi
            timeout --signal=TERM --kill-after=10s 60s sudo dpkg --configure -a
            sleep 10
          done
      - name: Install pinned browsers
        timeout-minutes: 5
        run: pnpm --filter socialprune exec playwright install chromium firefox webkit
      - run: pnpm --filter socialprune test:e2e

  cli-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '24.15.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter socialprune build:release
      - run: pnpm --filter socialprune pack:check
      - run: pnpm --filter socialprune smoke:package

  # ADR-031: packaged Electron flows on Windows.
  desktop:
    runs-on: windows-latest
    # Local Windows build, red controls, 29 packaged tests and both smokes:
    # 17.5 min on 2026-10-18, plus install/unit work. Allow 50% + 5 min.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @socialprune/desktop exec playwright install chromium
      # Restore the archive before units, not only before installed proofs.
      # actions/cache v4.2.4 is already admitted (MIT, 2026-10-19, ADR-002).
      - name: Read pinned NSIS archive digest
        id: nsis
        run: node --input-type=module -e "import { NSIS_SHA256 } from './apps/desktop/packaging/nsis-version.ts'; console.log('sha256=' + NSIS_SHA256)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/desktop/dist/nsis-3.13.zip
          key: nsis-${{ steps.nsis.outputs.sha256 }}
      - name: Prepare verified NSIS archive before unit tests
        run: node apps/desktop/packaging/nsis-cache.ts
      - run: pnpm build:desktop
      - run: pnpm --filter @socialprune/desktop fuses:check
      - run: pnpm --filter @socialprune/desktop test:red
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: desktop-red-control-outputs
          if-no-files-found: warn
          path: apps/desktop/dist/red-controls/
      - run: pnpm exec vitest run --project desktop --project licenses-check --project lint-rules --maxWorkers=2
      - run: pnpm test:desktop
      - run: pnpm smoke:desktop
      - name: Installed release budgets and system boundary
        run: |
          pnpm --filter @socialprune/desktop build:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @socialprune/desktop test:release-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm smoke:desktop:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-installed-measurements
          if-no-files-found: warn
          path: |
            apps/desktop/dist/release-smoke.json
            apps/desktop/dist/release-medians.json
            apps/desktop/dist/release-*.json
