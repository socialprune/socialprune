name: Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release artifact to Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm --filter @socialprune/web build:release
      - run: node apps/web/scripts/build-check.ts
      - run: pnpm exec vitest run --project web apps/web/tooling/pages-workflow.test.ts
        env:
          SP_PAGES_OUTPUT_CHECK: '1'
      - run: pnpm guide:check --max-age 120 --release
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/web/dist
  deploy:
    needs: build
    if: |
      inputs.publish && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
