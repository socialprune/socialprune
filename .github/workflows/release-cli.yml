name: CLI release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guide:check --max-age 120 --release
      - run: pnpm --filter socialprune build:release
      - run: pnpm --filter socialprune pack:check
      - run: pnpm --filter socialprune smoke:package

  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - name: Require bundled npm 11.5.1 or newer
        shell: bash
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; const version=execFileSync("npm",["--version"],{encoding:"utf8"}).trim(); if(!/^\d+\.\d+\.\d+$/.test(version)) process.exit(1); const [major,minor,patch]=version.split(".").map(Number); if(major<11 || (major===11 && (minor<5 || (minor===5 && patch<1)))) process.exit(1);'
      - run: pnpm install --frozen-lockfile
      - run: pnpm guide:check --max-age 120 --release
      - run: pnpm --filter socialprune build:release
      - run: pnpm --filter socialprune pack:check
      - run: pnpm --filter socialprune smoke:package
      - run: npm publish --provenance --access public
        working-directory: apps/cli/dist/package
